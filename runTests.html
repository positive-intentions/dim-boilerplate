<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dim-boilerplate — DimTest</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
    <!--
      HTTP-only test runner next to index.html (dimui uses import()).
      DimTest CDN loads first for splash + toolbar; then Dim / runtime /
      cover (embeds DimParse); notes/** are fetched + instrumented in-page.
      Production notes/ files on disk are never rewritten.
      Same ?impl=js|wasm as the app (toolbar reloads).
    -->
  </head>
  <body>
    <div id="dim-test-root" hidden></div>

    <script>
      (function () {
        var STORAGE_KEY = "dim-boilerplate-impl";
        var CDN_DIM_LIB = "https://positive-intentions.github.io/dim/lib/";
        var impl = "js";
        var dimLib = CDN_DIM_LIB;
        try {
          var params = new URLSearchParams(location.search || "");
          var q = params.get("impl") || "";
          q = String(q).toLowerCase();
          if (q === "js" || q === "wasm") {
            impl = q;
            try {
              localStorage.setItem(STORAGE_KEY, impl);
            } catch (e) {}
          } else {
            var stored = (localStorage.getItem(STORAGE_KEY) || "").toLowerCase();
            if (stored === "js" || stored === "wasm") impl = stored;
          }
          // Optional local Pages tree while iterating on the harness:
          //   ?dimLib=http://127.0.0.1:8765/lib/
          var dl = params.get("dimLib") || "";
          if (dl) {
            dimLib = dl.charAt(dl.length - 1) === "/" ? dl : dl + "/";
          }
        } catch (e) {}
        document.documentElement.dataset.dimRuntime = impl;

        var dimSrc =
          impl === "wasm"
            ? dimLib + "dim.wasm.global.js"
            : dimLib + "dim.global.js";

        var notesScripts = [
          "./notes/lib/vault.js",
          "./notes/lib/tokens.js",
          "./notes/lib/theme.js",
          "./notes/lib/mockData/mockData.js",
          "./notes/lib/sharedKeys.js",
          "./notes/lib/note-filters/note-filters.js",
          "./notes/components/atoms/button.js",
          "./notes/components/atoms/icon.js",
          "./notes/components/atoms/icon-button.js",
          "./notes/components/atoms/chip.js",
          "./notes/components/atoms/text-field.js",
          "./notes/components/atoms/empty-state.js",
          "./notes/components/atoms/fab.js",
          "./notes/components/molecules/search-field.js",
          "./notes/components/molecules/confirm-dialog.js",
          "./notes/components/molecules/folder-item.js",
          "./notes/components/molecules/mobile-folder-bar.js",
          "./notes/components/molecules/notes-header.js",
          "./notes/components/molecules/note-item/note-item.js",
          "./notes/components/organisms/folder-rail.js",
          "./notes/components/organisms/unlock-screen.js",
          "./notes/components/organisms/note-list.js",
          "./notes/components/organisms/note-editor.js",
          "./notes/components/organisms/navigation-view.js",
          "./notes/components/organisms/notes-shell.js",
          "./notes/components/templates/notes-layout.js",
          "./notes/components/pages/notes-app/notes-app.js",
        ];

        var testScripts = [
          "./notes/lib/vault.test.js",
          "./notes/lib/tokens.test.js",
          "./notes/lib/theme.test.js",
          "./notes/lib/sharedKeys.test.js",
          "./notes/lib/note-filters/note-filters.test.js",
          "./notes/lib/mockData/mockData.test.js",
          "./notes/components/molecules/confirm-dialog.test.js",
          "./notes/components/molecules/folder-item.test.js",
          "./notes/components/molecules/mobile-folder-bar.test.js",
          "./notes/components/molecules/notes-header.test.js",
          "./notes/components/molecules/note-item/note-item.test.js",
          "./notes/components/organisms/note-list.test.js",
          "./notes/components/organisms/note-editor.test.js",
          "./notes/components/organisms/folder-rail.test.js",
          "./notes/components/organisms/unlock-screen.test.js",
          "./notes/components/organisms/navigation-view.test.js",
          "./notes/components/templates/notes-layout.test.js",
          "./notes/components/organisms/notes-shell.test.js",
          "./notes/components/pages/notes-app/notes-app.test.js",
        ];

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            s.onload = function () {
              resolve();
            };
            s.onerror = function () {
              reject(new Error("Failed to load " + src));
            };
            document.head.appendChild(s);
          });
        }

        function loadScriptChain(urls, index) {
          if (index >= urls.length) return Promise.resolve();
          return loadScript(urls[index]).then(function () {
            return loadScriptChain(urls, index + 1);
          });
        }

        function coverPathFromSrc(src) {
          return String(src).replace(/^\.\//, "");
        }

        function injectInstrumented(source, file) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.text =
              source +
              "\n//# sourceURL=" +
              file.replace(/[^\w./-]/g, "_");
            try {
              document.head.appendChild(s);
              resolve();
            } catch (err) {
              reject(err);
            }
          });
        }

        function loadInstrumentedNotes(index) {
          if (index >= notesScripts.length) return Promise.resolve();
          var src = notesScripts[index];
          var file = coverPathFromSrc(src);
          DimTest.splash(
            "Instrumenting " +
              (index + 1) +
              "/" +
              notesScripts.length +
              "…",
          );
          return fetch(src)
            .then(function (res) {
              if (!res.ok) {
                throw new Error(
                  "Failed to fetch " + src + " (" + res.status + ")",
                );
              }
              return res.text();
            })
            .then(function (text) {
              var instrumented = DimTest.instrument(text, file);
              return injectInstrumented(instrumented, file);
            })
            .then(function () {
              return loadInstrumentedNotes(index + 1);
            });
        }

        function boot() {
          return loadScript(dimLib + "dim.test.global.js")
            .then(function () {
              if (!globalThis.DimTest) {
                throw new Error("DimTest global missing");
              }
              DimTest.splash("Loading Dim (" + impl + ")…");
              return loadScriptChain(
                [dimSrc, "./runtime.js", dimLib + "dim.cover.global.js"],
                0,
              );
            })
            .then(function () {
              if (!globalThis.Dim) {
                throw new Error("Dim global missing — check CDN / ?impl=");
              }
              if (!globalThis.DimTest.instrument) {
                throw new Error(
                  "DimTest.instrument missing — need dim.cover.global.js on the Dim CDN",
                );
              }
              if (!globalThis.DimParse || !globalThis.DimParse.parse) {
                throw new Error(
                  "DimParse missing — need a dim.cover.global.js that embeds DimParse (rebuild Pages lib or ?dimLib=)",
                );
              }
              if (!globalThis.BP) {
                throw new Error("BP runtime missing");
              }
              DimTest.splash("Instrumenting notes…");
              return loadInstrumentedNotes(0);
            })
            .then(function () {
              DimTest.splash("Loading tests…");
              return loadScriptChain(testScripts, 0);
            })
            .then(function () {
              DimTest.splash("Running tests…");
              return DimTest.run();
            });
        }

        boot().catch(function (err) {
          if (globalThis.DimTest && DimTest.splash) {
            DimTest.splash(String(err && err.message ? err.message : err));
          }
          globalThis.__DIM_TEST__ = {
            done: true,
            passed: 0,
            failed: 1,
            results: [
              {
                name: "boot",
                ok: false,
                error: String(err && err.stack ? err.stack : err),
              },
            ],
          };
          console.error(err);
        });
      })();
    </script>
  </body>
</html>
