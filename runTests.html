<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dim-boilerplate — DimTest</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
    <!--
      Test runner next to index.html (dimui classic scripts + Dim CDN / ?dimLib=).
      DimTest loads first for splash + toolbar; then Dim / runtime /
      cover (embeds DimParse) / verify. On http(s), notes/** are fetched +
      instrumented. On file:// (e.g. ?dimLib=../dim/Frontend/lib/&dimuiSrc=../dimui/src/),
      scripts load via <script src>; coverage is skipped when text cannot be read.
      Production notes/ files on disk are never rewritten.
      Same ?impl=js|wasm as the app (toolbar reloads).
    -->
  </head>
  <body>
    <div id="dim-test-root" hidden></div>

    <script>
      (function () {
        var STORAGE_KEY = "dim-boilerplate-impl";
        var CDN_DIM_LIB = "https://positive-intentions.github.io/dim/lib/";
        var impl = "js";
        var dimLib = CDN_DIM_LIB;
        try {
          var params = new URLSearchParams(location.search || "");
          var q = params.get("impl") || "";
          q = String(q).toLowerCase();
          if (q === "js" || q === "wasm") {
            impl = q;
            try {
              localStorage.setItem(STORAGE_KEY, impl);
            } catch (e) {}
          } else {
            var stored = (localStorage.getItem(STORAGE_KEY) || "").toLowerCase();
            if (stored === "js" || stored === "wasm") impl = stored;
          }
          // Optional local Pages tree while iterating on the harness:
          //   ?dimLib=http://127.0.0.1:8765/lib/
          var dl = params.get("dimLib") || "";
          if (dl) {
            dimLib = dl.charAt(dl.length - 1) === "/" ? dl : dl + "/";
          }
        } catch (e) {}
        document.documentElement.dataset.dimRuntime = impl;

        // Isolate DimTest from the live app vault on the same origin:
        // Dim always opens IndexedDB "DimDatabase"; redirect to a per-run/test name.
        var VAULT_FLAG = "dimui-vault";
        var LIVE_DB = "DimDatabase";
        var testRunId =
          Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
        var testDbSeq = 0;
        var originalIdbOpen = indexedDB.open.bind(indexedDB);
        // Expose for verification / debugging without hitting the redirect.
        globalThis.__DIM_ORIG_IDB_OPEN__ = originalIdbOpen;
        indexedDB.open = function (name, version) {
          var next = name;
          if (name === LIVE_DB) {
            next = LIVE_DB + "_test_" + testRunId + "_" + testDbSeq;
          }
          return originalIdbOpen(next, version);
        };

        function snapshotVaultFlag() {
          try {
            return {
              has: localStorage.getItem(VAULT_FLAG) !== null,
              value: localStorage.getItem(VAULT_FLAG),
            };
          } catch (e) {
            return { has: false, value: null };
          }
        }

        function restoreVaultFlag(snap) {
          try {
            if (!snap || !snap.has) {
              localStorage.removeItem(VAULT_FLAG);
            } else {
              localStorage.setItem(VAULT_FLAG, snap.value);
            }
          } catch (e) {}
        }

        function sleep(ms) {
          return new Promise(function (resolve) {
            setTimeout(resolve, ms);
          });
        }

        function withVaultIsolation(runFn) {
          var snap = snapshotVaultFlag();
          return Promise.resolve()
            .then(function () {
              return runFn();
            })
            .then(
              function (result) {
                restoreVaultFlag(snap);
                return result;
              },
              function (err) {
                restoreVaultFlag(snap);
                throw err;
              },
            );
        }

        function installTestIsolation() {
          var origTest = DimTest.test;
          // Per-test DB seq + drain orphan useStore persists so the next test's
          // encryption key does not receive "vault"/"notes"/"folders" events
          // encrypted with the previous password (shared window event names).
          DimTest.test = function (name, fn) {
            return origTest(name, function () {
              testDbSeq += 1;
              var self = this;
              var args = arguments;
              function drain(result, isError) {
                // useStore persist is 300ms + CustomEvent debounce 200ms + IDB.
                // Let the current key's listeners consume those events first,
                // then unmount so the next test's password never decrypts them.
                return sleep(600)
                  .then(function () {
                    if (DimTest.clearFixture) DimTest.clearFixture();
                    return sleep(300);
                  })
                  .then(function () {
                    if (isError) throw result;
                    return result;
                  });
              }
              return Promise.resolve()
                .then(function () {
                  return fn.apply(self, args);
                })
                .then(
                  function (result) {
                    return drain(result, false);
                  },
                  function (err) {
                    return drain(err, true);
                  },
                );
            });
          };

          var origRun = DimTest.run.bind(DimTest);
          DimTest.run = function () {
            return withVaultIsolation(origRun);
          };

          var origRerun = DimTest.rerun.bind(DimTest);
          DimTest.rerun = function () {
            testRunId =
              Date.now().toString(36) +
              "_" +
              Math.random().toString(36).slice(2, 8);
            testDbSeq = 0;
            return withVaultIsolation(origRerun);
          };
        }

        var dimSrc =
          impl === "wasm"
            ? dimLib + "dim.wasm.global.js"
            : dimLib + "dim.global.js";

        var notesScripts = [
          "./notes/lib/vault.js",
          "./notes/lib/tokens.js",
          "./notes/lib/theme.js",
          "./notes/lib/mockData/mockData.js",
          "./notes/lib/sharedKeys.js",
          "./notes/lib/types.js",
          "./notes/lib/note-filters/note-filters.js",
          "./notes/lib/note-editor-logic.js",
          "./notes/lib/notes-app-logic.js",
          "./notes/components/atoms/button.js",
          "./notes/components/atoms/icon.js",
          "./notes/components/atoms/icon-button.js",
          "./notes/components/atoms/chip.js",
          "./notes/components/atoms/text-field.js",
          "./notes/components/atoms/empty-state.js",
          "./notes/components/atoms/fab.js",
          "./notes/components/molecules/search-field.js",
          "./notes/components/molecules/confirm-dialog.js",
          "./notes/components/molecules/folder-item.js",
          "./notes/components/molecules/mobile-folder-bar.js",
          "./notes/components/molecules/notes-header.js",
          "./notes/components/molecules/note-item/note-item.js",
          "./notes/components/organisms/folder-rail.js",
          "./notes/components/organisms/unlock-screen.js",
          "./notes/components/organisms/note-list.js",
          "./notes/components/organisms/note-editor.js",
          "./notes/components/organisms/navigation-view.js",
          "./notes/components/organisms/notes-shell.js",
          "./notes/components/templates/notes-layout.js",
          "./notes/components/pages/notes-app/notes-app.js",
        ];

        var testScripts = [
          "./notes/lib/vault.test.js",
          "./notes/lib/tokens.test.js",
          "./notes/lib/theme.test.js",
          "./notes/lib/sharedKeys.test.js",
          "./notes/lib/note-filters/note-filters.test.js",
          "./notes/lib/mockData/mockData.test.js",
          "./notes/components/atoms/atoms.test.js",
          "./notes/components/molecules/confirm-dialog.test.js",
          "./notes/components/molecules/folder-item.test.js",
          "./notes/components/molecules/mobile-folder-bar.test.js",
          "./notes/components/molecules/notes-header.test.js",
          "./notes/components/molecules/note-item/note-item.test.js",
          "./notes/components/organisms/note-list.test.js",
          "./notes/components/organisms/note-editor.test.js",
          "./notes/components/organisms/folder-rail.test.js",
          "./notes/components/organisms/unlock-screen.test.js",
          "./notes/components/organisms/navigation-view.test.js",
          "./notes/components/templates/notes-layout.test.js",
          "./notes/components/organisms/notes-shell.test.js",
          "./notes/components/pages/notes-app/notes-app.test.js",
          // Iframe AUT against real index.html (needs DimTest.open from dim CDN /
          // ?dimLib= while iterating on the harness).
          "./notes/e2e/helpers.js",
          "./notes/e2e/notes-app.e2e.test.js",
          "./notes/e2e/notes-crud.e2e.test.js",
          "./notes/e2e/notes-organize.e2e.test.js",
          "./notes/e2e/notes-hash.e2e.test.js",
          "./notes/e2e/app-shell.e2e.test.js",
        ];

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            s.onload = function () {
              resolve();
            };
            s.onerror = function () {
              reject(new Error("Failed to load " + src));
            };
            document.head.appendChild(s);
          });
        }

        function loadScriptChain(urls, index) {
          if (index >= urls.length) return Promise.resolve();
          return loadScript(urls[index]).then(function () {
            return loadScriptChain(urls, index + 1);
          });
        }

        function coverPathFromSrc(src) {
          return String(src).replace(/^\.\//, "");
        }

        var isFileProtocol =
          typeof location !== "undefined" && location.protocol === "file:";
        var coverSkippedNotified = false;

        function absoluteUrl(src) {
          try {
            return new URL(src, location.href).href;
          } catch (e) {
            return src;
          }
        }

        /** Try to read source text (HTTP / some file:// browsers). */
        function readText(src) {
          var url = absoluteUrl(src);
          return fetch(url)
            .then(function (res) {
              if (!res.ok) {
                throw new Error(
                  "Failed to fetch " + src + " (" + res.status + ")",
                );
              }
              return res.text();
            })
            .catch(function (fetchErr) {
              return new Promise(function (resolve, reject) {
                try {
                  var xhr = new XMLHttpRequest();
                  xhr.open("GET", url, true);
                  xhr.onload = function () {
                    if (xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) {
                      resolve(xhr.responseText);
                    } else {
                      reject(fetchErr);
                    }
                  };
                  xhr.onerror = function () {
                    reject(fetchErr);
                  };
                  xhr.send();
                } catch (e) {
                  reject(fetchErr);
                }
              });
            });
        }

        function maybeVerifyAdd(text, file) {
          if (
            text &&
            globalThis.DimTest &&
            DimTest.verify &&
            DimTest.verify.add &&
            /notes\/(types|note-filters|note-editor-logic|notes-app-logic)|note-item|confirm-dialog|note-editor|notes-app/.test(
              file,
            )
          ) {
            DimTest.verify.add(text, file);
          }
        }

        function injectInstrumented(source, file) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.text =
              source +
              "\n//# sourceURL=" +
              file.replace(/[^\w./-]/g, "_");
            try {
              document.head.appendChild(s);
              resolve();
            } catch (err) {
              reject(err);
            }
          });
        }

        /**
         * Load a notes source for execution (+ coverage/verify when text is readable).
         * On file:// Chrome, fetch/XHR often fail: fall back to <script src> and
         * soft-skip instrumentation so boot still succeeds.
         */
        function loadNotesSource(src, file) {
          return readText(src)
            .then(function (text) {
              maybeVerifyAdd(text, file);
              var instrumented = DimTest.instrument(text, file);
              return injectInstrumented(instrumented, file);
            })
            .catch(function () {
              if (!isFileProtocol) {
                return Promise.reject(
                  new Error("Failed to fetch " + src + " (and XHR fallback)"),
                );
              }
              if (!coverSkippedNotified && DimTest.splash) {
                coverSkippedNotified = true;
                DimTest.splash(
                  "Coverage skipped on file:// (Chrome cannot read local sources); loading via script src…",
                );
              }
              return loadScript(src);
            });
        }

        function loadInstrumentedNotes(index) {
          if (index >= notesScripts.length) return Promise.resolve();
          var src = notesScripts[index];
          var file = coverPathFromSrc(src);
          DimTest.splash(
            "Instrumenting " +
              (index + 1) +
              "/" +
              notesScripts.length +
              "…",
          );
          return loadNotesSource(src, file).then(function () {
            return loadInstrumentedNotes(index + 1);
          });
        }

        function loadDimuiVerifySources() {
          // dimuiSrc is the src/ directory (same as runtime.js / ?dimuiSrc=).
          var dimuiBase =
            (globalThis.__DIM_BOILERPLATE__ &&
              globalThis.__DIM_BOILERPLATE__.dimuiSrc) ||
            "https://positive-intentions.github.io/dimui/src/";
          try {
            var params = new URLSearchParams(location.search || "");
            var ds = params.get("dimuiSrc") || "";
            if (ds) {
              dimuiBase = ds.charAt(ds.length - 1) === "/" ? ds : ds + "/";
            }
          } catch (e) {}
          var remote = [
            "lib/notes/types.js",
            "lib/notes/note-filters.js",
            "lib/notes/note-editor-logic.js",
            "components/notes/molecules/note-item.js",
            "components/molecules/confirm-dialog.js",
            "components/notes/organisms/note-editor.js",
          ];
          function next(i) {
            if (i >= remote.length) return Promise.resolve();
            var path = remote[i];
            return readText(dimuiBase + path)
              .then(function (text) {
                if (text && DimTest.verify && DimTest.verify.add) {
                  DimTest.verify.add(text, "dimui/" + path);
                }
              })
              .catch(function () {})
              .then(function () {
                return next(i + 1);
              });
          }
          return next(0);
        }

        function boot() {
          return loadScript(dimLib + "dim.test.global.js")
            .then(function () {
              if (!globalThis.DimTest) {
                throw new Error("DimTest global missing");
              }
              installTestIsolation();
              DimTest.splash("Loading Dim (" + impl + ")…");
              return loadScriptChain(
                [
                  dimSrc,
                  "./runtime.js",
                  dimLib + "dim.cover.global.js",
                  dimLib + "dim.verify.global.js",
                ],
                0,
              );
            })
            .then(function () {
              if (!globalThis.Dim) {
                throw new Error("Dim global missing — check CDN / ?impl=");
              }
              if (!globalThis.DimTest.instrument) {
                throw new Error(
                  "DimTest.instrument missing — need dim.cover.global.js on the Dim CDN",
                );
              }
              if (!globalThis.DimParse || !globalThis.DimParse.parse) {
                throw new Error(
                  "DimParse missing — need a dim.cover.global.js that embeds DimParse (rebuild Pages lib or ?dimLib=)",
                );
              }
              if (!globalThis.DimTest.verify) {
                throw new Error(
                  "DimTest.verify missing — need dim.verify.global.js on the Dim CDN / ?dimLib=",
                );
              }
              if (!globalThis.BP) {
                throw new Error("BP runtime missing");
              }
              DimTest.splash("Instrumenting notes…");
              return loadInstrumentedNotes(0);
            })
            .then(function () {
              DimTest.splash("Verifying dimui sources…");
              return loadDimuiVerifySources();
            })
            .then(function () {
              DimTest.splash("Loading tests…");
              return loadScriptChain(testScripts, 0);
            })
            .then(function () {
              DimTest.splash("Running tests…");
              return DimTest.run();
            });
        }

        boot().catch(function (err) {
          if (globalThis.DimTest && DimTest.splash) {
            DimTest.splash(String(err && err.message ? err.message : err));
          }
          globalThis.__DIM_TEST__ = {
            done: true,
            passed: 0,
            failed: 1,
            results: [
              {
                name: "boot",
                ok: false,
                error: String(err && err.stack ? err.stack : err),
              },
            ],
          };
          console.error(err);
        });
      })();
    </script>
  </body>
</html>
