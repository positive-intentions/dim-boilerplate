<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dim-boilerplate — encrypted notes</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f172a;
        color: #e2e8f0;
      }
    </style>
    <!--
      Inline classic script so document.write runs while the parser is open.
      That sync-loads the Dim IIFE from GitHub Pages before runtime.js / notes / app.js.
      Classic https:// scripts work from file://; dimui atoms use ESM import() instead.
      When a service worker already controls the page, Dim is loaded via the
      same-scope ./pwa/cdn/ proxy so the worker can serve it offline.
    -->
    <script>
      (function () {
        var STORAGE_KEY = "dim-boilerplate-impl";
        var CDN_DIM_LIB = "https://positive-intentions.github.io/dim/lib/";
        var controlled =
          typeof navigator !== "undefined" &&
          navigator.serviceWorker &&
          navigator.serviceWorker.controller;
        var DIM_LIB = controlled ? "./pwa/cdn/dim/lib/" : CDN_DIM_LIB;
        var impl = "js";
        try {
          var q = new URLSearchParams(location.search || "").get("impl") || "";
          q = String(q).toLowerCase();
          if (q === "js" || q === "wasm") {
            impl = q;
            try {
              localStorage.setItem(STORAGE_KEY, impl);
            } catch (e) {}
          } else {
            var stored = (localStorage.getItem(STORAGE_KEY) || "").toLowerCase();
            if (stored === "js" || stored === "wasm") impl = stored;
          }
        } catch (e) {}
        document.documentElement.dataset.dimRuntime = impl;
        var src =
          impl === "wasm"
            ? DIM_LIB + "dim.wasm.global.js"
            : DIM_LIB + "dim.global.js";
        document.write('<script src="' + src + '"><\/script>');
      })();
    </script>
    <script src="./runtime.js"></script>

    <!-- lib -->
    <script src="./notes/lib/vault.js"></script>
    <script src="./notes/lib/tokens.js"></script>
    <script src="./notes/lib/theme.js"></script>
    <script src="./notes/lib/mockData.js"></script>
    <script src="./notes/lib/sharedKeys.js"></script>
    <script src="./notes/lib/note-filters.js"></script>

    <!-- atoms (proxies → remote dimui) -->
    <script src="./notes/components/atoms/button.js"></script>
    <script src="./notes/components/atoms/icon.js"></script>
    <script src="./notes/components/atoms/icon-button.js"></script>
    <script src="./notes/components/atoms/chip.js"></script>
    <script src="./notes/components/atoms/text-field.js"></script>
    <script src="./notes/components/atoms/empty-state.js"></script>
    <script src="./notes/components/atoms/fab.js"></script>

    <!-- molecules -->
    <script src="./notes/components/molecules/search-field.js"></script>
    <script src="./notes/components/molecules/confirm-dialog.js"></script>
    <script src="./notes/components/molecules/folder-item.js"></script>
    <script src="./notes/components/molecules/mobile-folder-bar.js"></script>
    <script src="./notes/components/molecules/notes-header.js"></script>
    <script src="./notes/components/molecules/note-item.js"></script>

    <!-- organisms -->
    <script src="./notes/components/organisms/folder-rail.js"></script>
    <script src="./notes/components/organisms/unlock-screen.js"></script>
    <script src="./notes/components/organisms/note-list.js"></script>
    <script src="./notes/components/organisms/note-editor.js"></script>
    <script src="./notes/components/organisms/navigation-view.js"></script>
    <script src="./notes/components/organisms/notes-shell.js"></script>

    <!-- templates + pages -->
    <script src="./notes/components/templates/notes-layout.js"></script>
    <script src="./notes/components/pages/notes-app.js"></script>

    <script src="./app.js"></script>
    <script src="./pwa.js"></script>
  </head>
  <body>
    <boilerplate-app></boilerplate-app>
  </body>
</html>
